<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>BTC 현재가 · 업비트</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#111827;--sub:#6b7280;--line:#e5e7eb;--rise:#d60000;--fall:#0062df;--even:#6b7280;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--text:#f3f4f6;--sub:#9ca3af;--line:#243049;--rise:#ff5a5a;--fall:#5aa2ff;--even:#9ca3af}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;min-height:100vh;padding:16px}
.wrap{max-width:480px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px}
h1{font-size:17px;margin:0;font-weight:700}
.badge{font-size:12px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px}
.pair{color:var(--sub);font-size:14px}
.price{font-size:clamp(34px,11vw,48px);font-weight:800;letter-spacing:-.02em;margin:8px 0 4px;font-variant-numeric:tabular-nums;transition:color .3s}
.price small{font-size:.45em;font-weight:600;margin-left:4px;color:var(--sub)}
.chg{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.rise{color:var(--rise)}.fall{color:var(--fall)}.even{color:var(--even)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.cell span{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.cell b{font-size:15px;font-variant-numeric:tabular-nums}
.cell.wide{grid-column:1/-1}
#btn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
#btn:active{opacity:.85}
.foot{margin-top:12px;font-size:12px;color:var(--sub);text-align:center;line-height:1.6}
.err{display:none;margin-top:12px;padding:12px;border-radius:12px;background:rgba(220,38,38,.12);color:var(--rise);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:6px}
.dot.live{background:#22c55e}

.tabs{display:flex;gap:6px;margin:18px 0 8px}
.tabs button{flex:1;padding:8px 0;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--card);border-color:var(--text)}
#cinfo{font-size:11px;color:var(--sub);min-height:30px;line-height:15px;font-variant-numeric:tabular-nums}
#chartbox{position:relative;margin-top:4px}
#svg{display:block;width:100%;height:230px;touch-action:pan-y;user-select:none}
#cmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>₿ 비트코인 현재가</h1>
    <div class="badge"><span class="dot" id="dot"></span><span id="status">연결 중…</span></div>
  </header>

  <div class="card">
    <div class="pair">BTC / KRW · 업비트</div>
    <div class="price even" id="price">--<small>원</small></div>
    <div class="chg even" id="chg">전일 대비 --</div>
    <div class="tabs" id="tabs">
      <button type="button" data-r="d" class="on">일봉</button>
      <button type="button" data-r="w">주봉</button>
      <button type="button" data-r="m">월봉</button>
    </div>
    <div id="cinfo">&nbsp;</div>
    <div id="chartbox"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg><div id="cmsg">차트 불러오는 중…</div></div>
  </div>

  <div class="grid">
    <div class="cell"><span>고가 (당일)</span><b id="high">--</b></div>
    <div class="cell"><span>저가 (당일)</span><b id="low">--</b></div>
    <div class="cell"><span>전일 종가</span><b id="prev">--</b></div>
    <div class="cell"><span>24시간 거래대금</span><b id="vol">--</b></div>
    <div class="cell wide"><span>체결 시각</span><b id="time">--</b></div>
  </div>

  <div class="err" id="err"></div>
  <button id="btn" type="button">새로고침</button>
  <div class="foot">데이터 출처: 업비트 Open API<br>시세 /v1/ticker · 차트 /v1/candles<br>Vercel → api.upbit.com/v1/ticker<br>5초마다 자동 갱신</div>
</div>

<script>
(function(){
  var URL = "/api/ticker?market=KRW-BTC"; // Vercel 서버리스 함수(프록시)를 통해 업비트 호출
  var INTERVAL = 5000; // 서버 캐시(2초)가 있어 5초 간격으로 갱신
  var $ = function(id){ return document.getElementById(id); };
  var last = null, busy = false;

  function won(n){ return Math.round(n).toLocaleString("ko-KR"); }
  function eok(n){
    if (n >= 1e12) return (n/1e12).toFixed(2) + "조 원";
    return Math.round(n/1e8).toLocaleString("ko-KR") + "억 원";
  }
  function cls(change){ return change === "RISE" ? "rise" : change === "FALL" ? "fall" : "even"; }

  function render(t){
    var c = cls(t.change);
    var arrow = c === "rise" ? "▲" : c === "fall" ? "▼" : "";
    var sign = t.signed_change_price > 0 ? "+" : t.signed_change_price < 0 ? "-" : "";
    var pr = $("price");
    pr.className = "price " + c;
    pr.innerHTML = won(t.trade_price) + "<small>원</small>";
    var ch = $("chg");
    ch.className = "chg " + c;
    ch.textContent = "전일 대비 " + arrow + " " + won(Math.abs(t.signed_change_price)) + "원 (" + sign + (Math.abs(t.signed_change_rate)*100).toFixed(2) + "%)";
    $("high").textContent = won(t.high_price);
    $("low").textContent = won(t.low_price);
    $("prev").textContent = won(t.prev_closing_price);
    $("vol").textContent = eok(t.acc_trade_price_24h);
    $("time").textContent = new Date(t.trade_timestamp).toLocaleString("ko-KR", {hour12:false});
    last = t.trade_price;
  }

  function setStatus(ok, msg){
    $("dot").className = "dot" + (ok ? " live" : "");
    $("status").textContent = msg;
  }

  function load(){
    if (busy) return;
    busy = true;
    $("btn").textContent = "불러오는 중…";
    fetch(URL, {headers:{"Accept":"application/json"}})
      .then(function(r){
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(list){
        if (!list || !list.length) throw new Error("응답이 비어 있습니다");
        render(list[0]);
        $("err").style.display = "none";
        setStatus(true, new Date().toLocaleTimeString("ko-KR", {hour12:false}) + " 갱신");
      })
      .catch(function(e){
        var m = $("err");
        m.style.display = "block";
        m.textContent = "시세를 불러오지 못했습니다 (" + e.message + "). 네트워크 상태를 확인하고 다시 시도해 주세요.";
        setStatus(false, "연결 실패");
      })
      .finally(function(){
        busy = false;
        $("btn").textContent = "새로고침";
      });
  }


  /* ---------- 캔들 차트 (업비트 캔들 API) ---------- */
  var RANGES = {
    "d": {u:"days",   c:60},   // 일봉 60개
    "w": {u:"weeks",  c:52},   // 주봉 52개 (약 1년)
    "m": {u:"months", c:36}    // 월봉 36개 (3년)
  };
  var cur = "d", pts = [];

  function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function fmtT(t){ return t.slice(0,10); }   // 일·주·월봉은 시작 날짜 표시

  function defaultInfo(){
    if (!pts.length) { $("cinfo").innerHTML = "&nbsp;"; return; }
    var hi = Math.max.apply(null, pts.map(function(x){return x.h;}));
    var lo = Math.min.apply(null, pts.map(function(x){return x.l;}));
    $("cinfo").textContent = "기간 고가 " + won(hi) + " · 저가 " + won(lo);
  }

  function drawChart(){
    if (!pts.length) return;
    var svg = $("svg"), W = svg.clientWidth || 340, H = 230, R = 68, top = 10, vh = 44, gap = 8;
    var Wp = W - R, bot = H - vh - gap, n = pts.length;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    var hi = -Infinity, lo = Infinity, vm = 0;
    pts.forEach(function(p){ if (p.h > hi) hi = p.h; if (p.l < lo) lo = p.l; if (p.v > vm) vm = p.v; });
    var pad = (hi - lo) * 0.06 || 1; hi += pad; lo -= pad;
    var cw = Wp / n, bw = Math.max(1, cw * 0.68);
    var xs = function(i){ return (i + 0.5) * cw; };
    var ys = function(v){ return top + (hi - v) / (hi - lo) * (bot - top); };
    var cr = cssv("--rise"), cf = cssv("--fall"), cl = cssv("--line"), cs = cssv("--sub"), cc = cssv("--card");

    var o = "", k, y;
    for (k = 0; k <= 4; k++) {                       // 연한 가로 격자 + 가격 눈금
      y = top + (bot - top) * k / 4;
      o += '<line x1="0" x2="' + Wp + '" y1="' + y + '" y2="' + y + '" stroke="' + cl + '"/>' +
           '<text x="' + (Wp + 6) + '" y="' + (y + 3.5) + '" font-size="10" fill="' + cs + '">' + won(hi - (hi - lo) * k / 4) + '</text>';
    }
    pts.forEach(function(p, i){                      // 캔들 + 거래대금 막대
      var col = p.c >= p.o ? cr : cf, x = xs(i);
      var yo = ys(p.o), yc = ys(p.c), yt = Math.min(yo, yc), bh = Math.max(1, Math.abs(yo - yc));
      var vv = vm ? p.v / vm * vh : 0;
      o += '<line x1="' + x + '" x2="' + x + '" y1="' + ys(p.h) + '" y2="' + ys(p.l) + '" stroke="' + col + '"/>' +
           '<rect x="' + (x - bw/2) + '" y="' + yt + '" width="' + bw + '" height="' + bh + '" fill="' + col + '"/>' +
           '<rect x="' + (x - bw/2) + '" y="' + (H - vv) + '" width="' + bw + '" height="' + vv + '" fill="' + col + '" opacity=".35"/>';
    });
    var last = pts[n-1], ly = ys(last.c), lc = last.c >= last.o ? cr : cf;   // 현재가 점선 + 태그
    o += '<line x1="0" x2="' + Wp + '" y1="' + ly + '" y2="' + ly + '" stroke="' + lc + '" stroke-dasharray="2 3"/>' +
         '<rect x="' + (Wp + 2) + '" y="' + (ly - 8) + '" width="' + (R - 4) + '" height="16" rx="3" fill="' + lc + '"/>' +
         '<text x="' + (Wp + 6) + '" y="' + (ly + 3.5) + '" font-size="10" font-weight="700" fill="' + cc + '">' + won(last.c) + '</text>';
    o += '<line id="cv" y1="0" y2="' + bot + '" stroke="' + cs + '" stroke-dasharray="4 3" visibility="hidden"/>' +
         '<line id="ch" x1="0" x2="' + Wp + '" stroke="' + cs + '" stroke-dasharray="4 3" visibility="hidden"/>';
    svg.innerHTML = o;
    svg._m = {Wp: Wp, cw: cw, xs: xs, top: top, bot: bot, n: n};
    defaultInfo();
  }

  function pointer(e){
    var svg = $("svg"), m = svg._m; if (!m) return;
    var r = svg.getBoundingClientRect();
    var i = Math.max(0, Math.min(m.n - 1, Math.floor((e.clientX - r.left) / m.cw)));
    var y = Math.max(m.top, Math.min(m.bot, e.clientY - r.top));
    var v = $("cv"), h = $("ch"), p = pts[i];
    v.setAttribute("x1", m.xs(i)); v.setAttribute("x2", m.xs(i)); v.setAttribute("visibility", "visible");
    h.setAttribute("y1", y); h.setAttribute("y2", y); h.setAttribute("visibility", "visible");
    $("cinfo").textContent = fmtT(p.t) + "  시 " + won(p.o) + " · 고 " + won(p.h) + " · 저 " + won(p.l) + " · 종 " + won(p.c);
  }
  function pointerEnd(){
    var v = $("cv"), h = $("ch");
    if (v) v.setAttribute("visibility", "hidden");
    if (h) h.setAttribute("visibility", "hidden");
    defaultInfo();
  }

  function loadChart(){
    var rg = RANGES[cur], key = cur;
    fetch("/api/candles?market=KRW-BTC&unit=" + rg.u + "&count=" + rg.c)
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(list){
        if (key !== cur) return;               // 그 사이 탭이 바뀌었으면 무시
        pts = list.slice().reverse().map(function(x){
          return {t: x.candle_date_time_kst, o: x.opening_price, h: x.high_price, l: x.low_price, c: x.trade_price, v: x.candle_acc_trade_price};
        });
        $("cmsg").style.display = "none";
        drawChart();
      })
      .catch(function(e){
        if (key !== cur) return;
        $("cmsg").style.display = "flex";
        $("cmsg").textContent = "차트를 불러오지 못했습니다 (" + e.message + ")";
      });
  }

  $("tabs").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    cur = b.getAttribute("data-r");
    Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle("on", x === b); });
    pts = []; $("svg").innerHTML = ""; $("cmsg").style.display = "flex"; $("cmsg").textContent = "차트 불러오는 중…";
    loadChart();
  });
  var sv = $("svg");
  sv.addEventListener("pointerdown", pointer);
  sv.addEventListener("pointermove", pointer);
  sv.addEventListener("pointerleave", pointerEnd);
  sv.addEventListener("pointerup", pointerEnd);
  sv.addEventListener("pointercancel", pointerEnd);
  window.addEventListener("resize", drawChart);
  setInterval(function(){ if (!document.hidden) loadChart(); }, 30000);
  loadChart();

  $("btn").addEventListener("click", load);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });
  setInterval(function(){ if (!document.hidden) load(); }, INTERVAL);
  load();
})();
</script>
</body>
</html>
